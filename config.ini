; MouseTest standalone configuration (UTF-8 plain text).
; Missing file uses TouchPad=1, Mouse=0 and the built-in defaults below.
[language]
; zh-CN, en-US or vi-VN; case-insensitive.
Culture=zh-CN

[TouchPad]
; 1=enable, 0=disable; missing defaults to 1.
Enabled=1
; RowCount and ColumnCount are parsed as a pair. Invalid values fall back to 5x10.
RowCount=5
ColumnCount=10
; LeftClickCount and RightClickCount are parsed as a pair. Invalid values disable click checks.
LeftClickCount=1
RightClickCount=1
; Optional exclusion corner: corner x width x height; 0=top-left, 1=top-right, 2=bottom-left, 3=bottom-right.
; Empty means every cell must be covered.
Finger=

[Mouse]
; 1=enable, 0=disable; missing defaults to 0. At least one test must be enabled.
Enabled=0
; Raw mouse movement counts, independent of screen DPI. 0 disables that requirement.
MoveDistance=1200
MoveAxisDistance=300
; Wheel notches up and down (one notch = 120 raw wheel units). 0 disables.
WheelSteps=3
; Required click counts. 0 disables the individual action.
LeftClicks=1
DoubleClicks=1
RightClicks=1
MiddleClicks=1
; Left-button drag: count and minimum raw movement. DragDistance must be greater than ClickTolerance.
Drags=1
DragDistance=300
; Maximum raw movement that still counts as a click instead of a drag.
ClickTolerance=8
