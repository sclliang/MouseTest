; MouseTest standalone configuration (UTF-8 plain text).
; Missing file uses the built-in 5x10 grid and one left/right click.
[language]
; zh-CN, en-US or vi-VN; case-insensitive.
Culture=zh-CN

[TouchPad]
; RowCount and ColumnCount are parsed as a pair. Invalid values fall back to 5x10.
RowCount=5
ColumnCount=10
; LeftClickCount and RightClickCount are parsed as a pair. Invalid values disable click checks.
LeftClickCount=1
RightClickCount=1
; Optional exclusion corner: corner x width x height; 0=top-left, 1=top-right, 2=bottom-left, 3=bottom-right.
; Empty means every cell must be covered.
Finger=
